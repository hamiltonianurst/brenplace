name: Deploy KeyPublic game server

on:
  push:
    branches: [main]
    paths:
      - "scripts/keypublic-worker/**"
      - ".github/workflows/keypublic-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Cloudflare
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: scripts/keypublic-worker
          wranglerVersion: "4.158.0"
      - name: Explain the skip
        if: env.HAS_TOKEN != 'true'
        run: echo "CLOUDFLARE_API_TOKEN isn't set, so the KeyPublic server was not deployed."
