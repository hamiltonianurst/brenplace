name: Build and deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours, to pick up new essays
  workflow_dispatch:          # adds a "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Pull latest essays from Substack
        run: python3 scripts/update_essays.py

      - name: Collect site files
        run: rsync -a --exclude '.git' --exclude '.github' --exclude 'scripts' ./ _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
