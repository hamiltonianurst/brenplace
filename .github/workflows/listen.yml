name: Add article to listen feed

# Triggered by the share page at bren.place/listen-x11z2ucwncju/ (or the
# "Run workflow" button in the Actions tab).
on:
  workflow_dispatch:
    inputs:
      url:
        description: Article URL
        required: false
      title:
        description: Title override (optional)
        required: false
      text:
        description: Article text, if sending text instead of fetching the URL
        required: false

permissions:
  contents: write   # commit the MP3 + its metadata
  actions: write    # kick off the site deploy afterwards

# No concurrency group on purpose: GitHub keeps only one *waiting* run per
# group and cancels the rest, which would drop articles sent in quick
# succession. Each episode is its own pair of files, so parallel runs don't
# conflict; the push step below just rebases and retries.

jobs:
  add:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install trafilatura edge-tts mutagen piper-tts lameenc

      # The backup (Piper) voice is ~110 MB; keep it between runs.
      - uses: actions/cache@v5
        with:
          path: ~/.cache/piper-voices
          key: piper-voices-en_US-lessac-high

      - name: Make episode
        env:
          URL: ${{ inputs.url }}
          TITLE: ${{ inputs.title }}
          TEXT: ${{ inputs.text }}
        run: python3 scripts/listen/add_episode.py --url "$URL" --title "$TITLE" --text "$TEXT"

      - name: Commit
        env:
          TITLE: ${{ inputs.title || inputs.url || 'selected text' }}
        run: |
          git config user.name "listen-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A listen-x11z2ucwncju/episodes
          git commit -m "listen: add ${TITLE:0:72}"
          for i in 1 2 3 4 5; do
            git pull --rebase -q origin main && git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1

      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so start
      # the site deploy explicitly (workflow_dispatch is the allowed exception).
      # The deploy rebuilds feed.xml from the episode files.
      - name: Deploy site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
